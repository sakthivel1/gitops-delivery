################################################################################
# kube-prometheus-stack Helm values
# Deploy: helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
#           -n monitoring --create-namespace -f observability/prometheus/values.yaml
################################################################################

fullnameOverride: prometheus

prometheus:
  prometheusSpec:
    retention: 30d
    retentionSize: "50GB"
    replicas: 2
    replicaExternalLabelName: "replica"

    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 8Gi

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 100Gi

    # Scrape configs for application metrics
    additionalScrapeConfigs:
      - job_name: "finapp-dev"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["finapp-dev"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      - job_name: "finapp-staging"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["finapp-staging"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__

      - job_name: "finapp-prod"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["finapp-prod"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__

    # Load alert rules from ConfigMaps
    ruleSelector:
      matchLabels:
        app: finapp-alerts

# kube-state-metrics — cluster-level metrics
kubeStateMetrics:
  enabled: true

# node-exporter — node-level metrics
nodeExporter:
  enabled: true

# Alertmanager
alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 2
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          resources:
            requests:
              storage: 10Gi
  config:
    global:
      resolve_timeout: 5m
      slack_api_url: "${SLACK_WEBHOOK_URL}"

    route:
      group_by: ["alertname", "namespace", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "slack-platform"
      routes:
        - match:
            severity: critical
          receiver: "pagerduty-prod"
          continue: true
        - match:
            severity: warning
          receiver: "slack-platform"

    receivers:
      - name: "slack-platform"
        slack_configs:
          - channel: "#platform-alerts"
            send_resolved: true
            title: "[{{ .Status | toUpper }}{{ if eq .Status \"firing\" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}"
            text: >-
              {{ range .Alerts }}
              *Alert:* {{ .Annotations.summary }}
              *Details:* {{ .Annotations.description }}
              *Namespace:* {{ .Labels.namespace }}
              *Severity:* {{ .Labels.severity }}
              {{ end }}

      - name: "pagerduty-prod"
        pagerduty_configs:
          - routing_key: "${PAGERDUTY_KEY}"
            description: "{{ .CommonAnnotations.summary }}"
            severity: "{{ .CommonLabels.severity }}"

# Grafana — managed separately (see observability/grafana/values.yaml)
grafana:
  enabled: false
