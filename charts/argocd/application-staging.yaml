apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finapp-staging
  namespace: argocd
  labels:
    environment: staging
    team: platform
  annotations:
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: platform-alerts
    notifications.argoproj.io/subscribe.on-sync-failed.slack: platform-alerts-urgent
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: finapp
  source:
    repoURL: https://gitlab.company.com/platform/gitops.git
    targetRevision: main
    path: charts/app
    helm:
      releaseName: finapp
      valueFiles:
        - values.yaml
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: finapp-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  revisionHistoryLimit: 20
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
