# Bootstrap ArgoCD into EKS — apply with:
#   kubectl apply -f charts/argocd/bootstrap.yaml
#
# Prerequisites:
#   kubectl create namespace argocd
#   kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/v2.10.4/manifests/install.yaml

---
# Patch argocd-cm to enable apiKey capability for admin (required for CI token auth)
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  accounts.admin: "apiKey,login"

---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: finapp
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Financial application delivery project
  sourceRepos:
    - "https://github.com/sakthivel1/gitops-delivery.git"
  destinations:
    - namespace: finapp-dev
      server: https://kubernetes.default.svc
    - namespace: finapp-staging
      server: https://kubernetes.default.svc
    - namespace: finapp-prod
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "apps"
      kind: Deployment
    - group: "autoscaling"
      kind: HorizontalPodAutoscaler
    - group: "policy"
      kind: PodDisruptionBudget
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: "networking.k8s.io"
      kind: Ingress
  roles:
    - name: pipeline-deployer
      description: CI/CD pipeline sync role
      policies:
        - p, proj:finapp:pipeline-deployer, applications, sync, finapp/*, allow
        - p, proj:finapp:pipeline-deployer, applications, get, finapp/*, allow
      jwtTokens: []
