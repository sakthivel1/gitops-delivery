apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finapp-dev
  namespace: argocd
  labels:
    environment: dev
    team: platform
  annotations:
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: platform-alerts
    notifications.argoproj.io/subscribe.on-sync-failed.slack: platform-alerts
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: finapp
  source:
    repoURL: https://github.com/sakthivel1/gitops-delivery.git
    targetRevision: main
    path: charts/app
    helm:
      releaseName: finapp
      valueFiles:
        - values.yaml
        - values-dev.yaml
      parameters:
        - name: image.tag
          value: "dev-latest"  # Overridden by CI pipeline
  destination:
    server: https://kubernetes.default.svc
    namespace: finapp-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas  # Managed by HPA
