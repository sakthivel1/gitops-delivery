replicaCount: 1

image:
  repository: nginx
  tag: "alpine"

serviceAccount:
  annotations: {}

ingress:
  enabled: false

ingress:
  hosts:
    - host: app.dev.internal.company.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: finapp-tls-dev
      hosts:
        - app.dev.internal.company.com

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

autoscaling:
  enabled: false

env:
  - name: APP_ENV
    value: "dev"
  - name: LOG_LEVEL
    value: "debug"

podDisruptionBudget:
  enabled: false
