replicaCount: 2

image:
  tag: "staging-latest"

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789:role/finapp-staging-irsa

ingress:
  hosts:
    - host: app.staging.internal.company.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: finapp-tls-staging
      hosts:
        - app.staging.internal.company.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5

env:
  - name: APP_ENV
    value: "staging"
  - name: LOG_LEVEL
    value: "info"
  - name: DB_HOST
    valueFrom:
      secretKeyRef:
        name: finapp-staging-secrets
        key: db-host
